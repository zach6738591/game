[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riot-game-prototype"
version = "0.1.0"
description = "Ethically-aware civic unrest simulation prototype"
authors = [{name = "Design Lab"}]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Simulation"
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
